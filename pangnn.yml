# panGNN environment: OS independent, no versions pinned.
# Taken from the environment the code was last tested in (Python 3.11, latest releases of every package at the time).
# GPU: install a CUDA build of PyTorch that matches your driver first, see the README.
name: panGNN
channels:
  - conda-forge
  #- bioconda
  #- pyg
dependencies:
  - python
  - pytorch
  - torchmetrics
  - accelerate
  - rich
  - scikit-learn
  - scipy
  - numpy
  - pandas
  - seaborn
  - matplotlib-base
  - networkx
  - tensorboard
  # PyG from conda-forge, replaces the pyg conda channel (only GCNConv is used, no extension libraries needed)
  - pytorch_geometric
  # pip variant that was tested in the development environment, use it if the conda-forge package does not solve:
  #- pip
  #- pip:
  #    - torch_geometric

